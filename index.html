<!DOCTYPE html>
<html>
<head>
    <title>Quantum Gauntlet - Fixed</title>
    <style>
        /* ... (keep previous styles) ... */
    </style>
</head>
<body>
    <div id="score">Level: 0/100 | Best: 0</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restart">INITIATE SEQUENCE</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const restartButton = document.getElementById('restart');

// Dynamic canvas sizing
function resizeCanvas() {
    canvas.width = Math.min(window.innerWidth - 20, 400);
    canvas.height = 600;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Game constants
const TUNNEL_SPEED = 3;
const TUNNEL_GAP = 160; // 160px vertical space
const TUNNEL_WIDTH = 60;
const SHIP_SIZE = 20; // 40px diameter
const GRAVITY_FORCE = 2;

// Game state
let gravity = 1;
let score = 0;
let bestScore = parseInt(localStorage.getItem('bestScore')) || 0;
let isAlive = true;
const ship = { 
    x: 100, 
    y: canvas.height/2, 
    color: '#00f7ff',
    trail: []
};

// Handcrafted level data (first 10 levels)
const levels = [
    // Level 1-5: Training sequence
    {x: 400, gap: 220}, {x: 700, gap: 260}, {x: 1000, gap: 180},
    {x: 1300, gap: 300}, {x: 1600, gap: 200},
    
    // Level 6-10: Core mechanics
    {x: 1900, gap: 240}, 
    // LEVEL 7 - SPECIFIC FIX:
    {x: 2200, gap: 240, spacing: 300}, // 240px gap center (240-80=160 to 240+80=320)
    {x: 2500, gap: 160}, {x: 2800, gap: 280}, {x: 3100, gap: 200}
];

// Generate remaining levels with safe patterns
for(let i = 10; i < 100; i++) {
    levels.push({
        x: levels[i-1].x + 300 - (i * 1.5),
        gap: Math.max(80, Math.min(
            levels[i-1].gap + (i % 2 === 0 ? 80 : -80),
            canvas.height - TUNNEL_GAP - 80
        ))
    });
}

let tunnels = [];

function initializeTunnels() {
    tunnels = levels.map(l => ({
        x: l.x,
        gap: l.gap - TUNNEL_GAP/2, // Center the gap vertically
        scored: false
    }));
}

function reverseGravity() {
    gravity *= -1;
    ship.color = gravity === 1 ? '#00f7ff' : '#ff00ff';
    ship.trail = [];
}

function gameLoop() {
    if (!isAlive) return;

    ctx.fillStyle = '#0a0a28';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ship movement
    ship.y += gravity * GRAVITY_FORCE;
    ship.trail.push({x: ship.x, y: ship.y});
    if(ship.trail.length > 20) ship.trail.shift();
    
    // Draw ship with safety buffer
    ctx.fillStyle = ship.color;
    const effectiveSize = SHIP_SIZE * 0.8; // 10% safety margin
    ship.trail.forEach((pos, i) => {
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, effectiveSize * (0.2 + 0.8*i/ship.trail.length), 0, Math.PI*2);
        ctx.fill();
    });

    // Tunnel logic
    tunnels.forEach((tunnel) => {
        // Vertical gap: tunnel.gap to tunnel.gap + TUNNEL_GAP
        ctx.fillStyle = `rgba(0, 247, 255, 0.5)`;
        ctx.fillRect(tunnel.x, 0, TUNNEL_WIDTH, tunnel.gap);
        ctx.fillRect(tunnel.x, tunnel.gap + TUNNEL_GAP, TUNNEL_WIDTH, canvas.height);

        tunnel.x -= TUNNEL_SPEED;

        // Collision detection with buffer
        const shipTop = ship.y - effectiveSize;
        const shipBottom = ship.y + effectiveSize;
        const gapTop = tunnel.gap;
        const gapBottom = tunnel.gap + TUNNEL_GAP;

        if (ship.x + effectiveSize > tunnel.x && 
            ship.x - effectiveSize < tunnel.x + TUNNEL_WIDTH) {
            if (shipTop < gapTop || shipBottom > gapBottom) {
                isAlive = false;
                restartButton.style.display = 'block';
            }
        }
    });

    // Update scoring
    tunnels.forEach(tunnel => {
        if (!tunnel.scored && ship.x > tunnel.x + TUNNEL_WIDTH) {
            tunnel.scored = true;
            score++;
            bestScore = Math.max(score, bestScore);
            localStorage.setItem('bestScore', bestScore);
            scoreElement.textContent = `Level: ${score}/100 | Best: ${bestScore}`;
        }
    });

    // Win condition
    if (score >= 100) {
        scoreElement.textContent = "QUANTUM MASTER!";
        isAlive = false;
        restartButton.style.display = 'block';
    }

    requestAnimationFrame(gameLoop);
}

// Controls
document.addEventListener('click', () => {
    if (isAlive) reverseGravity();
    else {
        isAlive = true;
        score = 0;
        gravity = 1;
        ship.y = canvas.height/2;
        ship.color = '#00f7ff';
        ship.trail = [];
        restartButton.style.display = 'none';
        initializeTunnels();
        scoreElement.textContent = `Level: 0/100 | Best: ${bestScore}`;
        gameLoop();
    }
});

// Init game
initializeTunnels();
gameLoop();
</script>
</body>
</html>
