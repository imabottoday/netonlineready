<!DOCTYPE html>
<html>
<head>
    <title>Quantum Gauntlet</title>
    <style>
        body {
            margin: 0;
            background: #0a0a28;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
        }
        #gameCanvas {
            border: 3px solid #00f7ff;
            box-shadow: 0 0 20px rgba(0,247,255,0.3);
        }
        #score {
            position: fixed;
            top: 20px;
            color: #00f7ff;
            font-size: 30px;
            text-shadow: 0 0 10px #00f7ff;
        }
        #restart {
            display: none;
            position: fixed;
            padding: 15px 30px;
            font-size: 20px;
            background: #00f7ff;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px #00f7ff;
        }
    </style>
</head>
<body>
    <div id="score">Level: 0/100 | Best: 0</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restart">INITIATE SEQUENCE</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const restartButton = document.getElementById('restart');

// Dynamic canvas sizing
function resizeCanvas() {
    canvas.width = Math.min(window.innerWidth - 20, 400);
    canvas.height = 600;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Game constants
const TUNNEL_SPEED = 3;
const TUNNEL_GAP = 160; // Wider gap
const TUNNEL_WIDTH = 60;
const SHIP_SIZE = 20;
const GRAVITY_FORCE = 2;

// Game state
let gravity = 1;
let score = 0;
let bestScore = parseInt(localStorage.getItem('bestScore')) || 0;
let isAlive = true;
const ship = { 
    x: 100, 
    y: canvas.height/2, 
    color: '#00f7ff',
    trail: []
};

// Precisely calculated level sequence
let levels = [];
(function createLevels() {
    let xPos = canvas.width;
    let currentY = canvas.height/2;
    const basePattern = Array(100).fill(null).map((_, i) => {
        const amplitude = 100 + (i * 2);
        const frequency = 0.05 + (i * 0.001);
        return Math.sin(i * frequency) * amplitude;
    });

    for(let i = 0; i < 100; i++) {
        const safeY = Math.min(Math.max(
            currentY + basePattern[i], 
            TUNNEL_GAP/2 + 40,
            canvas.height - TUNNEL_GAP/2 - 40
        ));
        
        levels.push({
            x: xPos,
            gap: safeY - TUNNEL_GAP/2,
            spacing: 300 - (i * 2)
        });
        
        xPos += 300 - (i * 2);
        currentY = safeY;
    }
})();

let tunnels = [];

function initializeTunnels() {
    tunnels = levels.map(l => ({ 
        x: l.x,
        gap: l.gap,
        scored: false
    }));
}

function reverseGravity() {
    gravity *= -1;
    ship.color = gravity === 1 ? '#00f7ff' : '#ff00ff';
    ship.trail = [];
}

function gameLoop() {
    if (!isAlive) return;

    ctx.fillStyle = '#0a0a28';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Ship physics
    ship.y += gravity * GRAVITY_FORCE;
    ship.trail.push({ x: ship.x, y: ship.y });
    if(ship.trail.length > 20) ship.trail.shift();
    
    // Draw ship trail
    ctx.fillStyle = ship.color;
    ship.trail.forEach((pos, i) => {
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, SHIP_SIZE * (0.2 + 0.8*i/ship.trail.length), 0, Math.PI*2);
        ctx.fill();
    });

    // Tunnel logic
    tunnels.forEach((tunnel, index) => {
        ctx.fillStyle = `rgba(0, 247, 255, ${0.2 + 0.8*(tunnel.x/canvas.width)})`;
        ctx.fillRect(tunnel.x, 0, TUNNEL_WIDTH, tunnel.gap);
        ctx.fillRect(tunnel.x, tunnel.gap + TUNNEL_GAP, TUNNEL_WIDTH, canvas.height);

        tunnel.x -= TUNNEL_SPEED;

        // Precision collision detection
        const inXRange = ship.x + SHIP_SIZE > tunnel.x && 
                       ship.x - SHIP_SIZE < tunnel.x + TUNNEL_WIDTH;
        const inYRange = ship.y - SHIP_SIZE < tunnel.gap || 
                       ship.y + SHIP_SIZE > tunnel.gap + TUNNEL_GAP;
        
        if (inXRange && inYRange) {
            isAlive = false;
            restartButton.style.display = 'block';
        }

        // Score tracking
        if (!tunnel.scored && ship.x > tunnel.x + TUNNEL_WIDTH) {
            tunnel.scored = true;
            score++;
            bestScore = Math.max(score, bestScore);
            localStorage.setItem('bestScore', bestScore);
            scoreElement.textContent = `Level: ${score}/100 | Best: ${bestScore}`;
            
            if(score === 100) {
                scoreElement.textContent = "QUANTUM MASTER!";
                isAlive = false;
                restartButton.style.display = 'block';
            }
        }
    });

    // Boundary check
    if (ship.y < -SHIP_SIZE || ship.y > canvas.height + SHIP_SIZE) {
        isAlive = false;
        restartButton.style.display = 'block';
    }

    requestAnimationFrame(gameLoop);
}

// Game controls
document.addEventListener('click', () => {
    if (isAlive) {
        reverseGravity();
    } else {
        // Reset game state
        isAlive = true;
        score = 0;
        gravity = 1; // Always start with downward gravity
        ship.y = canvas.height/2;
        ship.color = '#00f7ff';
        ship.trail = [];
        restartButton.style.display = 'none';
        initializeTunnels();
        scoreElement.textContent = `Level: 0/100 | Best: ${bestScore}`;
        gameLoop();
    }
});

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') document.click();
});

// Initial setup
initializeTunnels();
gameLoop();
</script>
</body>
</html>
