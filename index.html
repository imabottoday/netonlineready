<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>3D Number Fusion Puzzle - Complete</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #ui { 
            position: fixed; 
            top: 20px; 
            left: 20px; 
            color: white; 
            font-family: Arial, sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="ui"></div>
<script>
// ====================
// COMPLETE GAME IMPLEMENTATION
// ====================

const GameConfig = {
    NUM_RINGS: 3,
    SEGMENTS: 12,
    RADII: [200, 140, 80],
    COLORS: ['#FF6B6B', '#4ECDC4', '#45B7D1'],
    NUMBERS: [1, 2, 4, 8, 16, 32, 64, 128],
    Z_SPACING: 200,
    RING_THICKNESS: 30,
    CAMERA_Z: 1000,
    ROTATION_SPEED: 0.1,
    PARTICLE_LIFESPAN: 100
};

class GameState {
    constructor() {
        this.circles = [];
        this.score = 0;
        this.moves = 0;
        this.targetScore = 2048;
        this.activeRing = -1;
        this.rotationStart = 0;
        this.lastRotation = 0;
        this.particles = [];
        this.initCircles();
    }

    initCircles() {
        for (let i = 0; i < GameConfig.NUM_RINGS; i++) {
            this.circles.push({
                numbers: this.generateNumbers(i),
                rotation: 0,
                offset: 0,
                targetRotation: 0,
                z: i * GameConfig.Z_SPACING,
                color: GameConfig.COLORS[i % GameConfig.COLORS.length]
            });
        }
        this.ensureNoInitialMatches();
    }

    generateNumbers(ringIndex) {
        return Array(GameConfig.SEGMENTS).fill().map((_, idx) => {
            let num;
            do {
                num = GameConfig.NUMBERS[floor(random(GameConfig.NUMBERS.length))];
            } while (ringIndex > 0 && 
                    num === this.circles[ringIndex-1].numbers[idx]);
            return num;
        });
    }

    ensureNoInitialMatches() {
        for (let i = 0; i < GameConfig.NUM_RINGS - 1; i++) {
            for (let s = 0; s < GameConfig.SEGMENTS; s++) {
                while (this.circles[i].numbers[s] === this.circles[i+1].numbers[s]) {
                    this.circles[i+1].numbers[s] = 
                        GameConfig.NUMBERS[floor(random(GameConfig.NUMBERS.length))];
                }
            }
        }
    }
}

let gameState;
let font;

function preload() {
    font = loadFont('https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxK.woff');
}

function setup() {
    createCanvas(windowWidth, windowHeight, WEBGL);
    angleMode(DEGREES);
    textFont(font);
    textSize(20);
    textAlign(CENTER, CENTER);
    gameState = new GameState();
    setupCamera();
}

function setupCamera() {
    camera(0, 0, GameConfig.CAMERA_Z, 0, 0, 0, 0, 1, 0);
    perspective(PI/3, width/height, 0.1, GameConfig.CAMERA_Z * 2);
}

function draw() {
    background(30);
    handleCamera();
    updateGame();
    drawRings();
    drawParticles();
    drawUI();
}

function handleCamera() {
    if (mouseIsPressed && mouseButton === RIGHT) {
        orbitControl(1, 1, 0.1);
    } else {
        orbitControl(0, 0, 0);
    }
}

function updateGame() {
    updateRotations();
    checkMatches();
    updateParticles();
    checkWinCondition();
}

// ====================
// INPUT HANDLING
// ====================
function mousePressed() {
    const mouse = getProperMouse();
    const dist = sqrt(mouse.x*mouse.x + mouse.y*mouse.y);
    
    gameState.activeRing = GameConfig.RADII.findIndex((r, i) => 
        dist > (GameConfig.RADII[i+1] || 0) && dist <= r
    );
    
    if (gameState.activeRing !== -1) {
        gameState.rotationStart = atan2(mouse.y, mouse.x);
        gameState.lastRotation = gameState.circles[gameState.activeRing].rotation;
    }
}

function mouseDragged() {
    if (gameState.activeRing === -1) return;
    
    const mouse = getProperMouse();
    const currentAngle = atan2(mouse.y, mouse.x);
    const delta = currentAngle - gameState.rotationStart;
    
    gameState.circles[gameState.activeRing].rotation = 
        gameState.lastRotation + degrees(delta);
}

function mouseReleased() {
    if (gameState.activeRing === -1) return;
    
    const ring = gameState.circles[gameState.activeRing];
    const target = round(ring.rotation / 30) * 30;
    ring.targetRotation = target;
    
    const offsetDelta = -round((target - ring.rotation) / 30);
    ring.offset = (ring.offset + offsetDelta + GameConfig.SEGMENTS) % GameConfig.SEGMENTS;
    
    gameState.activeRing = -1;
    gameState.moves++;
}

// ====================
// RENDERING
// ====================
function drawRings() {
    gameState.circles.forEach((ring, i) => {
        push();
        translate(0, 0, -ring.z);
        rotateZ(ring.rotation);
        
        for (let s = 0; s < GameConfig.SEGMENTS; s++) {
            const num = ring.numbers[(s + ring.offset) % GameConfig.SEGMENTS];
            const isMatch = checkMatch(i, s);
            
            push();
            rotateZ(s * 360/GameConfig.SEGMENTS);
            drawSegment(ring, num, isMatch);
            pop();
        }
        pop();
    });
}

function drawSegment(ring, num, isMatch) {
    // 3D Geometry
    fill(isMatch ? color(255, 215, 0) : color(ring.color));
    noStroke();
    
    const radius = GameConfig.RADII[gameState.circles.indexOf(ring)];
    const angleStep = 5;
    
    // Front face
    beginShape();
    vertex(0, 0, GameConfig.RING_THICKNESS/2);
    for (let a = 0; a <= 30; a += angleStep) {
        const x = radius * cos(a);
        const y = radius * sin(a);
        vertex(x, y, GameConfig.RING_THICKNESS/2);
    }
    endShape(CLOSE);
    
    // Side walls
    beginShape(QUAD_STRIP);
    for (let a = 0; a <= 30; a += angleStep) {
        const x = radius * cos(a);
        const y = radius * sin(a);
        vertex(x, y, GameConfig.RING_THICKNESS/2);
        vertex(x, y, -GameConfig.RING_THICKNESS/2);
    }
    endShape();
    
    // Back face
    beginShape();
    vertex(0, 0, -GameConfig.RING_THICKNESS/2);
    for (let a = 0; a <= 30; a += angleStep) {
        const x = radius * cos(a);
        const y = radius * sin(a);
        vertex(x, y, -GameConfig.RING_THICKNESS/2);
    }
    endShape(CLOSE);
    
    // Number display
    push();
    translate(
        radius * 0.7 * cos(15),
        radius * 0.7 * sin(15),
        GameConfig.RING_THICKNESS * 1.2
    );
    rotateZ(-15);
    fill(0);
    text(num, 0, 0);
    pop();
}

// ====================
// GAME LOGIC
// ====================
function checkMatch(ringIndex, segment) {
    if (ringIndex >= gameState.circles.length - 1) return false;
    
    const current = gameState.circles[ringIndex]
        .numbers[(segment + gameState.circles[ringIndex].offset) % GameConfig.SEGMENTS];
    const below = gameState.circles[ringIndex + 1]
        .numbers[(segment + gameState.circles[ringIndex + 1].offset) % GameConfig.SEGMENTS];
    
    return current === below && current < 128;
}

function checkMatches() {
    let merged = false;
    
    for (let i = 0; i < GameConfig.NUM_RINGS - 1; i++) {
        for (let s = 0; s < GameConfig.SEGMENTS; s++) {
            if (checkMatch(i, s)) {
                mergeNumbers(i, s);
                createParticles(i, s);
                merged = true;
            }
        }
    }
    
    if (merged) gameState.score += 100;
}

function mergeNumbers(ringIndex, segment) {
    const current = gameState.circles[ringIndex]
        .numbers[(segment + gameState.circles[ringIndex].offset) % GameConfig.SEGMENTS];
    const nextRing = gameState.circles[ringIndex + 1];
    
    gameState.circles[ringIndex].numbers[
        (segment + gameState.circles[ringIndex].offset) % GameConfig.SEGMENTS
    ] = current * 2;
    
    nextRing.numbers[
        (segment + nextRing.offset) % GameConfig.SEGMENTS
    ] = GameConfig.NUMBERS[floor(random(GameConfig.NUMBERS.length))];
}

// ====================
// PARTICLES
// ====================
function createParticles(ringIndex, segment) {
    const angle = segment * (360/GameConfig.SEGMENTS);
    const radius = GameConfig.RADII[ringIndex];
    
    for (let i = 0; i < 15; i++) {
        gameState.particles.push({
            pos: createVector(
                radius * cos(angle),
                radius * sin(angle),
                -gameState.circles[ringIndex].z
            ),
            vel: p5.Vector.random3D().mult(random(1, 3)),
            life: GameConfig.PARTICLE_LIFESPAN
        });
    }
}

function updateParticles() {
    gameState.particles = gameState.particles.filter(p => {
        p.pos.add(p.vel);
        p.life -= 2;
        
        push();
        translate(p.pos.x, p.pos.y, p.pos.z);
        fill(255, 215, 0, p.life);
        noStroke();
        sphere(3);
        pop();
        
        return p.life > 0;
    });
}

// ====================
// UTILITIES
// ====================
function getProperMouse() {
    return createVector(
        (mouseX - width/2) * (width/(width * 0.5)),
        (mouseY - height/2) * (height/(height * 0.5))
    );
}

function updateRotations() {
    gameState.circles.forEach(ring => {
        if (abs(ring.rotation - ring.targetRotation) > 0.1) {
            ring.rotation = lerp(
                ring.rotation, 
                ring.targetRotation, 
                GameConfig.ROTATION_SPEED
            );
        }
    });
}

function checkWinCondition() {
    if (gameState.score >= gameState.targetScore) {
        document.getElementById('ui').innerHTML += 
            '<div style="color:#00ff00;">YOU WIN!</div>';
        noLoop();
    }
}

function drawUI() {
    document.getElementById('ui').innerHTML = `
        Score: ${gameState.score}<br>
        Moves: ${gameState.moves}<br>
        Target: ${gameState.targetScore}
    `;
}

function windowResized() {
    resizeCanvas(windowWidth, windowHeight);
    setupCamera();
}
</script>
</body>
</html>
