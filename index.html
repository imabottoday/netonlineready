<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Number Fusion Puzzle</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
  <style>
    #game-ui {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
<div id="game-ui">
  <h1>3D Puzzle</h1>
  <div id="score"></div>
  <div id="moves"></div>
</div>
<script>
/* --------------------------------------------------------
   Globals and Game State
-------------------------------------------------------- */
let font;
let state;

function preload() {
  font = loadFont('https://fonts.gstatic.com/s/roboto/v30/KFOmCnqEu92Fr1Mu4mxK.woff');
}

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  angleMode(DEGREES);
  textFont(font);

  initGame();
}

function draw() {
  background(20);
  orbitControl();

  updateParticles();
  drawGame();
  updateUI();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

/* --------------------------------------------------------
   Game State and Initialization
-------------------------------------------------------- */
function initGame() {
  state = {
    score: 0,
    moves: 0,
    targetScore: 2048,
    particles: [],
    circles: [],
    isGameOver: false,
  };

  const zSpacing = 150;
  for (let i = 0; i < 3; i++) {
    const circle = {
      radius: 200 - i * 50,
      zPos: i * zSpacing,
      rotation: 0,
      numbers: Array(12).fill().map(() => randomValidNumber()),
    };
    state.circles.push(circle);
  }

  ensureNoInitialMatches();
}

function ensureNoInitialMatches() {
  for (let i = 0; i < state.circles.length - 1; i++) {
    for (let s = 0; s < 12; s++) {
      while (state.circles[i].numbers[s] === state.circles[i + 1].numbers[s]) {
        state.circles[i + 1].numbers[s] = randomValidNumber();
      }
    }
  }
}

function randomValidNumber() {
  const allowedNumbers = [1, 2, 4, 8, 16, 32, 64, 128];
  return random(allowedNumbers);
}

/* --------------------------------------------------------
   Rendering
-------------------------------------------------------- */
function drawGame() {
  for (let i = 0; i < state.circles.length; i++) {
    drawCircle(state.circles[i], i);
  }
}

function drawCircle(circle, index) {
  push();
  translate(0, 0, -circle.zPos);
  rotateZ(circle.rotation);

  const colorBase = lerpColor(
    color(200, 100, 150),
    color(100, 200, 250),
    index / state.circles.length
  );

  for (let s = 0; s < 12; s++) {
    const num = circle.numbers[s];
    push();
    rotateZ(s * 360 / 12);
    drawSegment(circle.radius, num, colorBase);
    pop();
  }
  pop();
}

function drawSegment(radius, num, baseColor) {
  const wedgeAngle = 360 / 12;

  // Draw the wedge
  beginShape();
  fill(baseColor);
  for (let a = 0; a <= wedgeAngle; a += 5) {
    const x = radius * cos(a);
    const y = radius * sin(a);
    vertex(x, y);
  }
  vertex(0, 0);
  endShape(CLOSE);

  // Add text
  const midAngle = wedgeAngle / 2;
  const tx = radius * 0.8 * cos(midAngle);
  const ty = radius * 0.8 * sin(midAngle);

  push();
  translate(tx, ty, 10);
  rotateZ(-midAngle);

  fill(0, 200);
  rectMode(CENTER);
  rect(0, 0, textWidth(num) + 10, 30, 5);

  fill(255);
  textSize(20);
  text(num, 0, 5);
  pop();
}

/* --------------------------------------------------------
   Particles
-------------------------------------------------------- */
function createMergeEffect(x, y, z) {
  for (let i = 0; i < 15; i++) {
    state.particles.push({
      pos: createVector(x, y, z),
      vel: p5.Vector.random3D().mult(random(2, 5)),
      color: [255, 200, 0],
      life: 1.0,
    });
  }
}

function updateParticles() {
  for (let p of state.particles) {
    p.pos.add(p.vel);
    p.life -= 0.02;
  }
  state.particles = state.particles.filter(p => p.life > 0);

  for (let p of state.particles) {
    push();
    translate(p.pos.x, p.pos.y, p.pos.z);
    noStroke();
    fill(...p.color, p.life * 255);
    sphere(3);
    pop();
  }
}

/* --------------------------------------------------------
   User Input
-------------------------------------------------------- */
function mouseDragged() {
  const circle = getHoveredCircle();
  if (circle) {
    const dx = movedX * 0.1;
    circle.rotation += dx;
  }
}

function mouseReleased() {
  const circle = getHoveredCircle();
  if (circle) {
    snapToClosestSegment(circle);
    processMatches();
  }
}

function getHoveredCircle() {
  const mouseZ = 0;
  for (let circle of state.circles) {
    const distToCircle = abs(mouseZ - circle.zPos);
    if (distToCircle < 50) return circle;
  }
  return null;
}

function snapToClosestSegment(circle) {
  const snappedRotation = round(circle.rotation / (360 / 12)) * (360 / 12);
  circle.rotation = snappedRotation;
}

function processMatches() {
  for (let i = 0; i < state.circles.length - 1; i++) {
    const upper = state.circles[i];
    const lower = state.circles[i + 1];
    for (let s = 0; s < 12; s++) {
      if (upper.numbers[s] === lower.numbers[s]) {
        const mergedValue = upper.numbers[s] * 2;
        upper.numbers[s] = mergedValue;
        lower.numbers[s] = randomValidNumber();
        createMergeEffect(0, 0, -upper.zPos); // Approximate particle position
        state.score += mergedValue;
      }
    }
  }
}

/* --------------------------------------------------------
   UI and Feedback
-------------------------------------------------------- */
function updateUI() {
  const ui = document.getElementById('game-ui');
  ui.innerHTML = `
    <h1>3D Number Puzzle</h1>
    <p>Score: ${state.score}</p>
    <p>Moves: ${state.moves}</p>
  `;
}

</script>
</body>
</html>
