<!DOCTYPE html>
<html>
<head>
    <title>Gravity Flip - Flappy 2.0</title>
    <style>
        body {
            margin: 0;
            background: #0a0a28;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            touch-action: manipulation;
        }
        #gameCanvas {
            border: 3px solid #00f7ff;
            box-shadow: 0 0 20px rgba(0,247,255,0.3);
        }
        #score {
            position: fixed;
            top: 20px;
            color: #00f7ff;
            font-size: 30px;
            text-shadow: 0 0 10px #00f7ff;
        }
        #restart {
            display: none;
            position: fixed;
            padding: 15px 30px;
            font-size: 20px;
            background: #00f7ff;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px #00f7ff;
        }
    </style>
</head>
<body>
    <div id="score">Score: 0 | Best: 0</div>
    <canvas id="gameCanvas"></canvas>
    <button id="restart">QUANTUM JUMP!</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreElement = document.getElementById('score');
const restartButton = document.getElementById('restart');

function resizeCanvas() {
    canvas.width = Math.min(window.innerWidth - 20, 400);
    canvas.height = 600;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

let gravity = 1;
let score = 0;
let bestScore = localStorage.getItem('bestScore') || 0;
let isAlive = true;
const ship = { x: 100, y: canvas.height / 2, size: 20, color: '#00f7ff' };
const tunnels = [];
let tunnelGap = 120;
let tunnelWidth = 60;

function createTunnel() {
    const gapPosition = Math.random() * (canvas.height - tunnelGap);
    tunnels.push({ x: canvas.width, gap: gapPosition, scored: false });
}

function reverseGravity() {
    gravity *= -1;
    ship.color = gravity === 1 ? '#00f7ff' : '#ff00ff';
}

function gameLoop() {
    if (!isAlive) return;

    ctx.fillStyle = '#0a0a28';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ship.y += gravity * 2;
    ctx.fillStyle = ship.color;
    ctx.beginPath();
    ctx.arc(ship.x, ship.y, ship.size, 0, Math.PI * 2);
    ctx.fill();

    if (tunnels.length === 0 || tunnels[tunnels.length - 1].x < canvas.width - 350) {
        createTunnel();
    }

    tunnels.forEach((tunnel, index) => {
        ctx.fillStyle = `rgba(0, 247, 255, ${tunnel.x / canvas.width})`;
        ctx.fillRect(tunnel.x, 0, tunnelWidth, tunnel.gap);
        ctx.fillRect(tunnel.x, tunnel.gap + tunnelGap, tunnelWidth, canvas.height);
        tunnel.x -= 3;

        if ((ship.x + ship.size > tunnel.x && ship.x - ship.size < tunnel.x + tunnelWidth) &&
            ((ship.y - ship.size < tunnel.gap) || (ship.y + ship.size > tunnel.gap + tunnelGap))) {
            isAlive = false;
            restartButton.style.display = 'block';
        }

        if (!tunnel.scored && ship.x > tunnel.x + tunnelWidth) {
            tunnel.scored = true;
            score += 1;
            bestScore = Math.max(score, bestScore);
            localStorage.setItem('bestScore', bestScore);
            scoreElement.textContent = `Score: ${score} | Best: ${bestScore}`;
            tunnelGap = Math.max(80, tunnelGap - 2);
        }

        if (tunnel.x < -tunnelWidth) {
            tunnels.splice(index, 1);
        }
    });

    if (ship.y < -ship.size || ship.y > canvas.height + ship.size) {
        isAlive = false;
        restartButton.style.display = 'block';
    }

    requestAnimationFrame(gameLoop);
}

document.addEventListener('click', () => {
    if (isAlive) reverseGravity();
    else {
        isAlive = true;
        score = 0;
        tunnels.length = 0;
        ship.y = canvas.height / 2;
        restartButton.style.display = 'none';
        tunnelGap = 120;
        scoreElement.textContent = `Score: 0 | Best: ${bestScore}`;
        gameLoop();
    }
});

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') document.click();
});

gameLoop();
</script>
</body>
</html>
