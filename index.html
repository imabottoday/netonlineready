<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Concentric Circles Puzzle</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.6.0/lib/p5.min.js"></script>
</head>
<body>
<script>
/* --------------------------------------------------------
 *  GLOBALS
 * --------------------------------------------------------*/
let puzzleFont;
const NUM_SEGMENTS = 12;
const SEGMENT_ANGLE = 360 / NUM_SEGMENTS;
const CIRCLE_RADII = [200, 130, 70];
const HIGHLIGHT_COLOR = [255, 215, 0];
const COLOR_THEMES = [
  { base: [244, 67, 54], accent: [255, 235, 59] },
  { base: [33, 150, 243], accent: [0, 230, 118] },
  { base: [156, 39, 176], accent: [255, 152, 0] }
];

let circles = [];
let score = 0;
let activeCircleIndex = null;
let dragStartAngle = 0;
let circleStartRotation = 0;
let hasRotated = false;
let highlightedSegments = [];
let particles = [];

/* -----------------------------------------
 *  FONT LOADING
 * ----------------------------------------*/
function preload() {
  puzzleFont = loadFont('Roboto-Medium.ttf');
}

function setup() {
  createCanvas(800, 600, WEBGL);
  angleMode(DEGREES);
  perspective(60, width / height, 0.1, 5000);
  textFont(puzzleFont);
  textAlign(CENTER, CENTER);
  camera(0, -600, 800, 0, 0, 0, 0, 1, 0);
  initCircles();
}

function draw() {
  background(30);
  orbitControl();
  directionalLight(255, 255, 255, 0.5, 0.5, -1);
  ambientLight(60);

  // Draw particles
  particles.forEach((p, i) => {
    push();
    translate(p.pos);
    noStroke();
    fill(...p.color, p.life * 255);
    sphere(2);
    pop();
    p.pos.add(p.vel);
    p.life -= 0.02;
  });
  particles = particles.filter(p => p.life > 0);

  // Draw score
  push();
  resetMatrix();
  fill(255);
  textSize(24);
  text(`Score: ${score}`, 110, 40);
  pop();

  highlightedSegments = highlightedSegments.filter(h => millis() < h.expiresAt);

  // Auto-rotate idle circles
  if (frameCount % 60 === 0 && !circles.some(c => c.tweening)) {
    circles.forEach(c => {
      c.currentRotation += 0.2;
    });
  }

  updateCircleTweens();

  // Draw circles
  for (let i = 0; i < circles.length; i++) {
    drawCircle3D(i);
  }
}

/* -----------------------------------------
 *  Circle Initialization
 * ----------------------------------------*/
function initCircles() {
  circles = [];
  score = 0;
  for (let i = 0; i < CIRCLE_RADII.length; i++) {
    let numbers = [];
    for (let j = 0; j < NUM_SEGMENTS; j++) {
      numbers.push(floor(random(1, 10)));
    }
    circles.push({
      numbers,
      offset: 0,
      currentRotation: 0,
      targetRotation: 0,
      startRotation: 0,
      tweening: false,
      tweenStartTime: 0
    });
  }
}

/* -----------------------------------------
 *  3D Rendering
 * ----------------------------------------*/
function drawCircle3D(circleIndex) {
  const circleData = circles[circleIndex];
  const r = CIRCLE_RADII[circleIndex];
  const thickness = 20;
  const theme = COLOR_THEMES[circleIndex % COLOR_THEMES.length];

  push();
  translate(0, 0, circleIndex * 20);
  rotateZ(circleData.currentRotation);

  for (let s = 0; s < NUM_SEGMENTS; s++) {
    const segIndex = (circleData.offset + s) % NUM_SEGMENTS;
    const val = circleData.numbers[segIndex];
    const isHighlighted = highlightedSegments.some(h =>
      h.circleIndex === circleIndex && h.segmentIndex === segIndex
    );

    push();
    rotateZ(s * SEGMENT_ANGLE);

    // Wedge colors
    if (isHighlighted) {
      emissiveMaterial(HIGHLIGHT_COLOR);
      shininess(200);
    } else {
      specularMaterial(...theme.base);
      shininess(100);
    }

    drawWedgeLocal(r, thickness, SEGMENT_ANGLE);

    // Text
    const midAngle = SEGMENT_ANGLE * 0.5;
    const tx = r * 0.8 * cos(midAngle);
    const ty = r * 0.8 * sin(midAngle);

    push();
    translate(tx, ty, thickness * 1.5);

    // Billboard effect for text
    let cameraMatrix = new p5.Matrix();
    cameraMatrix.rotateZ(-midAngle);
    applyMatrix(cameraMatrix);

    noStroke();
    fill(0, 200);
    rectMode(CENTER);
    const fontSize = max(r * 0.08, 20);
    textSize(fontSize);

    const pad = 8;
    const tw = textWidth(val) + pad;
    const th = fontSize * 1.2;
    rect(0, 0, tw, th, 5);

    fill(255);
    drawingContext.shadowOffsetX = 1;
    drawingContext.shadowOffsetY = 1;
    drawingContext.shadowBlur = 2;
    drawingContext.shadowColor = 'rgba(0,0,0,0.5)';
    text(val, 0, -fontSize * 0.1);
    pop();

    pop();
  }
  pop();
}

function drawWedgeLocal(r, thickness, wedgeAngle) {
  const step = 5;

  beginShape();
  vertex(0, 0, thickness / 2);
  for (let a = 0; a <= wedgeAngle; a += step) {
    const xx = r * cos(a);
    const yy = r * sin(a);
    vertex(xx, yy, thickness / 2);
  }
  endShape(CLOSE);

  beginShape(QUAD_STRIP);
  for (let a = 0; a <= wedgeAngle; a += step) {
    const xx = r * cos(a);
    const yy = r * sin(a);
    vertex(xx, yy, thickness / 2);
    vertex(xx, yy, -thickness / 2);
  }
  endShape();

  beginShape();
  vertex(0, 0, -thickness / 2);
  for (let a = 0; a <= wedgeAngle; a += step) {
    const xx = r * cos(a);
    const yy = r * sin(a);
    vertex(xx, yy, -thickness / 2);
  }
  endShape(CLOSE);
}

/* -----------------------------------------
 *  Mouse Interaction
 * ----------------------------------------*/
function mousePressed() {
  const [mx, my] = screenToPuzzle(mouseX, mouseY);
  const distFromCenter = sqrt(mx * mx + my * my);
  hasRotated = false;
  activeCircleIndex = null;

  for (let i = 0; i < CIRCLE_RADII.length; i++) {
    const outerR = CIRCLE_RADII[i];
    const innerR = i < CIRCLE_RADII.length - 1 ? CIRCLE_RADII[i + 1] : 0;
    if (distFromCenter <= outerR && distFromCenter > innerR) {
      activeCircleIndex = i;
      let angle = degrees(atan2(my, mx));
      dragStartAngle = angle + circles[i].currentRotation;
      circleStartRotation = circles[i].currentRotation;
      break;
    }
  }
}

function mouseDragged() {
  if (activeCircleIndex === null) return;
  const [mx, my] = screenToPuzzle(mouseX, mouseY);
  let angle = degrees(atan2(my, mx));
  let delta = -(angle - dragStartAngle);
  circles[activeCircleIndex].currentRotation = circleStartRotation + delta;
}

function mouseReleased() {
  if (activeCircleIndex === null) return;

  if (hasRotated) {
    const c = circles[activeCircleIndex];
    const snapped = round(c.currentRotation / SEGMENT_ANGLE) * SEGMENT_ANGLE;
    c.targetRotation = snapped;
    c.tweenStartTime = millis();
    c.tweening = true;
  }
  activeCircleIndex = null;
}

function updateCircleTweens() {
  const now = millis();
  for (let c of circles) {
    if (c.tweening) {
      const duration = 400;
      const t = (now - c.tweenStartTime) / duration;
      const easedT = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

      if (t >= 1) {
        c.currentRotation = c.targetRotation;
        c.tweening = false;
      } else {
        c.currentRotation = lerp(c.startRotation, c.targetRotation, easedT);
      }
    }
  }
}

/* -----------------------------------------
 *  Utility Functions
 * ----------------------------------------*/
function screenToPuzzle(sx, sy) {
  const cx = sx - width / 2;
  const cy = sy - height / 2;
  return [cx, cy];
}
</script>
</body>
</html>
